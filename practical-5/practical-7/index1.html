<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOX MODEL</title>
    <style>
        *{
            margin:0; padding:0;
        }
        .box{
            background-color: rgb(0, 229, 255);
        }
        .box1{
            color:chartreuse;
            padding: 10px;
            margin: 35px;
            border: 2px solid rgb(1, 19, 19);
            height: 200px;
            box-sizing: border-box;
        }
        .box2{
            color: blueviolet;
            padding: 5px;
            margin: 30px;
            border: 4px solid red;
            height: 250px;
            width: 500px;
            box-sizing:border-box;

        }
    </style>
</head>
<body>
    <div class="box box1">Iam a box</div>
    <div class="box box2">Iam another box</div>

</body>
</html>
