<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid blue;
            width: 344px;
            padding: 45px;
            margin: 34px;
            display: inline-block;
        }
        .box1{
            /* display: none; */
             /* visibility: hidden;  */
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <div class="box box">It is a box also.</div>
    <div class="box box1">It is another box.</div>
    <span>I am a good</span>
    <span>speaker.</span>
</body>
</html>
