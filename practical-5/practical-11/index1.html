<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS VARIABLES</title>
    <style>
        :root{
            --color:yellow;
            --defop:0.4;
            --defpad:23px;
            --seccolor:green;
        }
        *{
            margin:0;
            padding:0;
        }
        .nav{
            background-color:var(--color);
        
        }
        ul{
            display:flex;
        }
        ul li{
            list-style:none;
            opacity:var(--defop);                     
            padding:var(--defpad);
            border:2px solid rgb(9, 1, 1);
        }
        ul li:first-child{
            background-color:var(--seccolor);
        }
    </style>
</head>
<body>
    <div class="nav">
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>
    <div class="container">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quidem veniam cum eum placeat, repellendus quisquam! Architecto debitis saepe itaque impedit?
    </div>
</body>
</html>
