<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        header{
            position:sticky;
            top:0;
        }
        nav{
            background-color:burlywood;
            height:83px;
        }
        main{
            background-color:lightblue;
            color:darkblue;
            padding:34px;
        }
        .container{
            background-color:rgb(229, 237, 152);
            margin:12px 34px;
            padding:55px 23px;
            text-align:center;
        }
        .box1{
            background-color:rgb(235, 230, 239);
            height:70vh;
            width:45%;
            margin:0px 12px;
            display:inline-block;
        }
        .box2{
            background-color:rgb(214, 184, 239);
            height:70vh;
            width:45%;
            margin:0px 12px;
            display:inline-block;
        }
        .text-box{
            padding:34px;
            border:2px solid black;;
            margin:50px 34vw;
            font-size:2em;
            border-radius:13px;
        }
        .orange-box{
            background:orange;
            height:32px;
            width:32px;
            position:fixed;
            bottom:12px;
            right:23px;
            border-radius:60px;
        }
        footer{
            height:100px;
            background-color:burlywood;
        }
    </style>
</head>
<body>
    <header>
         <nav>
            
         </nav>
    </header>
    <main>
       <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="text-box">
            <p>Hello,Welcome to my world.</p>
        </div>
       </div>
       <div class="orange-box"></div>
    </main>
    <footer>

    </footer>
</body>
</html>
