<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box shadow and Text shadow</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px rgb(34, 63, 207);
            margin-bottom: 80px;
        }
        .box1{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px red;
            margin-top: 80px;
        }
        .text-shadow{
            padding: 34px;
            text-shadow: 5px 15px 5px yellow;
        }
        
    </style>
</head>
<body>
    <div class="box">Iam a box.</div>
    <div class="box box1">Iam another box</div>
    <p class="text-shadow">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Nostrum, ipsam?</p>
</body>
</html>
