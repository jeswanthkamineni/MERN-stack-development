<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        
        .child {
            
            background-color: coral;
            border: 1px solid black;
            padding: 14px;margin: 14px;

        }
        .container {
            background-color: lightgreen;
            margin: 14px;padding: 14px;

        }
        </style>
</head>
<body>
    <div class="container"><section class="childcontainer">
        <div class="child">i am a child</div>
    </section></div>
    <script>
        document.querySelector('.child').addEventListener('dblclick', function(e) {
            e.stopPropagation();
            alert('Child element double-clicked!');
        });
        document.querySelector('.childcontainer').addEventListener('dblclick', function(e) {
            e.stopPropagation();
            alert('Child container double-clicked!');
        });
        document.querySelector('.container').addEventListener('dblclick', function() {
           
            alert('Container double-clicked!');
        });
        function randomcolour(){
    let val1=Math.ceil(0 + Math.random()*255);
    let val2=Math.ceil(0 + Math.random()*255);
    let val3=Math.ceil(0 + Math.random()*255);
    return `rgb(${val1}, ${val2}, ${val3})`;
}
